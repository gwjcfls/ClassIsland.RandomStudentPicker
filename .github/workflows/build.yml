name: Build and Release

on:
  push:
    tags:
      - "*.*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ClassIsland.RandomStudentPicker.csproj

      - name: Build
        run: dotnet build ClassIsland.RandomStudentPicker.csproj -c Release --no-restore

      - name: Pack plugin
        run: dotnet publish ClassIsland.RandomStudentPicker.csproj -c Release -p:CreateCipx=true -p:PowershellBinaryName=pwsh

      - name: Generate release body with MD5
        shell: pwsh
        run: |
          $cipx = Get-ChildItem ./cipx/*.cipx | Select-Object -First 1
          if ($null -eq $cipx) { throw "No .cipx package was produced." }
          $md5 = (Get-FileHash $cipx -Algorithm MD5).Hash
          $name = $cipx.Name
          $body = @(
            "插件包校验信息"
            ""
            "| 文件名 | 大小 | MD5 |"
            "| --- | --- | --- |"
            "| ``$name`` | $($cipx.Length) 字节 | ``$md5`` |"
            ""
            "<!-- CLASSISLAND_PKG_MD5 {""$name"": ""$md5""} -->"
          ) -join "`n"
          Set-Content -Path ./cipx/release-body.md -Value $body -Encoding utf8NoBOM
          Write-Host $body

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland.RandomStudentPicker
          path: ./cipx/*.cipx

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ./cipx/release-body.md
          files: ./cipx/*.cipx
          draft: false
          prerelease: false
