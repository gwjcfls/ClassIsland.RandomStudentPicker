name: Build and Release

on:
  push:
    tags:
      - "*.*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ClassIsland.RandomStudentPicker.csproj

      - name: Build
        run: dotnet build ClassIsland.RandomStudentPicker.csproj -c Release --no-restore

      - name: Pack plugin
        run: dotnet publish ClassIsland.RandomStudentPicker.csproj -c Release -p:CreateCipx=true

      - name: Show package info
        shell: pwsh
        run: |
          Get-ChildItem ./cipx
          Get-Content ./cipx/checksums.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland.RandomStudentPicker
          path: ./cipx/*.cipx

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          bodyFile: ./cipx/checksums.md
          files: ./cipx/*.cipx
          draft: false
          prerelease: false
